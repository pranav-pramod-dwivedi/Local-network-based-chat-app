<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#201E18" />
<title>Local Network Chat</title>
<style>
  :root {
    --bg:#F4EFE3; --card:#FBF8F0; --line:#E2DBC7; --ink:#201E18;
    --mut:#7C7663; --acc:#D95A2B; --acc-ink:#F8F1E4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  .bar { background:#201E18; color:var(--card); padding:13px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .bar .brand { font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:14px; }
  .bar-actions { display:flex; align-items:center; gap:10px; }
  .bar .state { font-size:12px; color:#C8C3B2; display:flex; align-items:center; gap:7px; }
  .bar .state i { width:8px; height:8px; border-radius:50%; background:#5A564A; display:inline-block; }
  .bar .state.live i { background:var(--acc); }
  .chip-btn { background:rgba(255,255,255,0.12); color:var(--card); font-size:11px; padding:4px 9px; border-radius:4px; border:1px solid rgba(255,255,255,0.2); cursor:pointer; font-weight:500; transition:all .2s; }
  .chip-btn:hover { background:rgba(255,255,255,0.22); border-color:var(--acc); }
  main { width:100%; max-width:640px; margin:0 auto; padding:28px 20px 24px; display:flex; flex-direction:column; gap:18px; overflow:hidden; flex:1; }
  .landing .eyebrow { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--mut); margin-bottom:10px; }
  .landing h1 { font-size:26px; line-height:1.2; font-weight:700; margin-bottom:6px; }
  .landing p.lede { color:var(--mut); margin-bottom:20px; font-size:14px; }
  .field { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  label { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.12em; }
  select,input[type="text"] { font:inherit; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:9px 11px; }
  select { flex:0 0 130px; }
  input[type="text"] { flex:1; min-width:140px; }
  input:focus,select:focus { outline:none; border-color:var(--acc); }
  .actions { display:flex; gap:10px; }
  button { font:inherit; font-weight:600; border:none; border-radius:6px; padding:10px 15px; cursor:pointer; }
  .primary { background:var(--acc); color:var(--acc-ink); }
  .primary:hover { filter:brightness(.96); }
  .ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .ghost:hover { border-color:var(--ink); }
  .room-banner { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; }
  .room-banner .code-tag { font-family:ui-monospace,Menlo,monospace; font-weight:bold; color:var(--acc); background:rgba(217,90,43,0.08); padding:3px 6px; border-radius:4px; }
  .hidden { display:none !important; }
  /* chat */
  .chat { flex:1; overflow-y:auto; padding:4px 2px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:74%; }
  .msg.me { align-self:flex-end; }
  .msg.them { align-self:flex-start; }
  .msg .who { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin-bottom:3px; }
  .msg .body { padding:9px 13px; border-radius:10px; box-shadow:0 1px 2px rgba(32,30,24,.06); }
  .msg .body .text { word-wrap:break-word; }
  .msg .time { font-size:10px; color:var(--mut); margin-top:3px; }
  .msg.me .body { background:var(--ink); color:var(--card); }
  .msg.me .body .time { color:rgba(251,248,240,.55); text-align:right; }
  .msg.them .body { background:var(--card); border:1px solid var(--line); }
  .sys { align-self:center; font-size:12px; color:var(--mut); font-style:italic; }
  .compose { display:flex; gap:10px; margin-top:14px; }
  .compose input { flex:1; }
  .compose button { flex:0 0 auto; }
</style>
</head>
<body>
  <div class="bar">
    <span class="brand">local network chat</span>
    <div class="bar-actions">
      <button class="chip-btn hidden" id="copyRoomBtn" title="Copy room link" aria-label="Copy room link">Copy Link</button>
      <span class="state" id="state"><i></i><span id="status">offline</span></span>
    </div>
  </div>

  <main>
    <section class="landing" id="landing">
      <div class="eyebrow">a quiet room for two</div>
      <h1>Talk to your people,<br/>no server in the way.</h1>
      <p class="lede">Messages travel straight between browsers. One of you makes a room, the rest join by link.</p>

      <label for="customName">Your display name</label>
      <div class="field">
        <input type="text" id="customName" placeholder="Enter your name" maxlength="24" />
        <select id="who" aria-label="Preset name select">
          <option value="">Presets...</option>
          <option value="Pranav">Pranav</option>
          <option value="Naman">Naman</option>
          <option value="passer-by">passer-by</option>
        </select>
      </div>

      <div class="actions">
        <button class="primary" id="createRoom">Create room</button>
      </div>

      <div class="field" style="margin-top:14px">
        <input type="text" id="roomCode" placeholder="…or paste a room code to join" aria-label="Room code" />
        <button class="ghost" id="joinRoom">Join</button>
      </div>
    </section>

    <div class="room-banner hidden" id="roomBanner">
      <span>Room: <span class="code-tag" id="activeRoomCode"></span></span>
      <div style="display:flex; gap:8px;">
        <button class="ghost" id="shareRoomBtn" style="padding:4px 10px; font-size:12px;" aria-label="Copy room invite link">Copy invite link</button>
        <button class="ghost" id="leaveRoomBtn" style="padding:4px 10px; font-size:12px; color:var(--mut);" title="Leave room" aria-label="Leave room">Leave</button>
      </div>
    </div>

    <section class="chat hidden" id="chatlog"></section>

    <section class="compose hidden" id="compose">
      <input type="text" id="msg" placeholder="Type a message…" autocomplete="off" aria-label="Chat message" />
      <button class="primary" id="send">Send</button>
    </section>
  </main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var log = $('chatlog'), input = $('msg'), customNameInput = $('customName'), whoSelect = $('who');
  var messages = [], conns = [], peer = null, isHost = false, roomCode = null;

  try {
    var savedName = localStorage.getItem('lnc_username');
    if (savedName) customNameInput.value = savedName;
  } catch (e) {}

  whoSelect.onchange = function () {
    if (whoSelect.value) {
      customNameInput.value = whoSelect.value;
      try { localStorage.setItem('lnc_username', whoSelect.value); } catch (e) {}
    }
  };

  customNameInput.oninput = function () {
    try { localStorage.setItem('lnc_username', customNameInput.value.trim()); } catch (e) {}
  };
  customNameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      if ($('roomCode').value.trim()) {
        $('joinRoom').click();
      } else {
        $('createRoom').click();
      }
    }
  });

  function setLive(live) { $('state').className = 'state' + (live ? ' live' : ''); }
  function status(t, live) { $('status').textContent = t; if (live !== undefined) setLive(live); }
  function who() {
    var n = customNameInput.value.trim();
    return n || whoSelect.value || 'passer-by';
  }
  function now() { return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

  function add(m, text) {
    if (m.sys && !m.text && text) m.text = text;
    messages.push(m);
    var isNearBottom = (log.scrollHeight - log.scrollTop - log.clientHeight) < 80;
    if (m.sys) {
      var s = document.createElement('div'); s.className = 'sys'; s.textContent = text || m.text || '';
      log.appendChild(s);
    } else {
      var div = document.createElement('div');
      div.className = 'msg ' + (m.from === who() ? 'me' : 'them');
      var whoEl = document.createElement('div'); whoEl.className = 'who'; whoEl.textContent = m.from;
      var body = document.createElement('div'); body.className = 'body';
      var txt = document.createElement('div'); txt.className = 'text'; txt.textContent = m.text;
      var time = document.createElement('div'); time.className = 'time'; time.textContent = m.time;
      body.appendChild(txt);
      div.appendChild(whoEl); div.appendChild(body); div.appendChild(time);
      log.appendChild(div);
    }
    if (isNearBottom || m.from === who()) {
      log.scrollTop = log.scrollHeight;
    }
  }

  function getInviteUrl() {
    return location.href.split('?')[0] + '?r=' + roomCode;
  }

  function copyInvite(btn) {
    var url = getInviteUrl();
    var prev = btn.textContent;
    function feedback() {
      btn.textContent = 'Copied!';
      btn.style.borderColor = 'var(--acc)';
      setTimeout(function () {
        btn.textContent = prev;
        btn.style.borderColor = '';
      }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(feedback).catch(function () {
        fallbackCopy(url, feedback);
      });
    } else {
      fallbackCopy(url, feedback);
    }
  }

  function fallbackCopy(text, callback) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      callback && callback();
    } catch (e) {}
  }

  $('copyRoomBtn').onclick = function () { copyInvite(this); };
  $('shareRoomBtn').onclick = function () { copyInvite(this); };

  function leaveRoom() {
    conns.forEach(function (c) { try { c.close(); } catch (e) {} });
    conns = [];
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    roomCode = null;
    isHost = false;
    messages = [];
    log.innerHTML = '';
    $('landing').classList.remove('hidden');
    $('roomBanner').classList.add('hidden');
    $('copyRoomBtn').classList.add('hidden');
    $('chatlog').classList.add('hidden');
    $('compose').classList.add('hidden');
    status('offline', false);
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, document.title, location.pathname);
    }
  }
  if ($('leaveRoomBtn')) $('leaveRoomBtn').onclick = leaveRoom;

  function showChat() {
    $('landing').classList.add('hidden');
    $('roomBanner').classList.remove('hidden');
    $('activeRoomCode').textContent = roomCode;
    $('copyRoomBtn').classList.remove('hidden');
    $('chatlog').classList.remove('hidden');
    $('compose').classList.remove('hidden');
    input.focus();
  }
  function broadcast(msg) { conns.forEach(function (c) { if (c.open) c.send(msg); }); }

  function wireConn(c) {
    c.on('open', function () {
      conns.push(c);
      status('room ' + roomCode, true);
      if (isHost) {
        if (messages.length) c.send({ t: 'init', history: messages });
        add({ sys: true, text: 'someone joined' }, 'someone joined');
      }
    });
    c.on('data', function (d) {
      try {
        d = (typeof d === 'string') ? JSON.parse(d) : d;
      } catch (e) {
        return;
      }
      if (!d || !d.t) return;
      if (d.t === 'init') {
        log.innerHTML = '';
        messages = [];
        if (Array.isArray(d.history)) {
          d.history.forEach(function (histMsg) {
            if (histMsg.sys) {
              add(histMsg, histMsg.text || 'system message');
            } else {
              add(histMsg);
            }
          });
        }
      } else if (d.t === 'chat') {
        add(d.msg);
      }
    });
    c.on('close', function () {
      conns = conns.filter(function (x) { return x !== c; });
      if (isHost) add({ sys: true, text: 'someone left' }, 'someone left');
      if (!isHost && conns.length === 0) status('disconnected', false);
    });
    c.on('error', function () {});
  }

  var CODE = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function randCode() { var s=''; for (var i=0;i<5;i++) s+=CODE[Math.floor(Math.random()*CODE.length)]; return s; }
  function join(code) {
    code = (code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) return;
    if (peer) { try { peer.destroy(); } catch (e) {} }
    roomCode = code; isHost = false;
    $('roomCode').value = code;
    peer = new Peer();
    peer.on('open', function () { status('joining ' + roomCode); var c = peer.connect(code, {reliable:true}); wireConn(c); showChat(); });
    peer.on('error', function (err) {
      status('room not found', false);
      add({ sys: true, text: 'Could not connect to room ' + roomCode + '. Make sure the host is online and the code is correct.' }, 'Could not connect to room ' + roomCode);
    });
  }

  $('createRoom').onclick = function () {
    roomCode = randCode(); isHost = true;
    peer = new Peer(roomCode);
    peer.on('open', function (id) {
      status('hosting ' + id, true);
      showChat();
    });
    peer.on('connection', wireConn);
    peer.on('error', function (err) { if (err.type === 'unavailable-id') { roomCode = randCode(); peer.destroy(); $('createRoom').onclick(); } });
  };

  $('joinRoom').onclick = function () { join($('roomCode').value); };
  $('roomCode').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') join($('roomCode').value);
  });

  function send() {
    var text = input.value.trim();
    if (!text) return;
    if (!roomCode) return;
    var msg = { from: who(), text: text, time: now() };
    add(msg);
    broadcast({ t: 'chat', msg: msg });
    input.value = '';
    input.focus();
  }
  $('send').onclick = send;
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

  var q = new URLSearchParams(location.search);
  var autoRoom = (q.get('r') || q.get('room') || '').trim().toUpperCase();
  if (autoRoom) join(autoRoom);
})();
</script>
</body>
</html>
