<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Local Network Chat — talk to friends on the same Wi-Fi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5468FF"/>
      <stop offset="1" stop-color="#3A4DB2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g transform="translate(920,80)">
    <rect x="0" y="34" width="250" height="52" rx="26" fill="#ffffff" opacity="0.22"/>
    <text x="24" y="66" font-family="ui-sans-serif, sans-serif" font-size="22" fill="#ffffff">hey! you up? 🙌</text>
    <rect x="30" y="104" width="200" height="52" rx="26" fill="#2b3a8e"/>
    <text x="54" y="136" font-family="ui-sans-serif, sans-serif" font-size="22" fill="#ffffff">yes!! netflix?</text>
  </g>
  <text x="84" y="80" font-family="ui-sans-serif, sans-serif" font-size="38" font-weight="700" fill="#ffffff">Local Network Chat</text>
  <text x="88" y="132" font-family="ui-sans-serif, sans-serif" font-size="22" fill="#dfe4ff">talk to friends on the</text>
  <text x="88" y="166" font-family="ui-sans-serif, sans-serif" font-size="22" fill="#dfe4ff">same Wi-Fi — instantly.</text>
  <text x="88" y="222" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#c3cbff">no cloud · no sign-up · just you, me &amp; our router</text>
</svg>